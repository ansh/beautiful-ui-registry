name: Deploy registry

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run more than one deploy at a time — two overlapping runs would race
# to publish different versions of the same slug.
concurrency:
  group: deploy-registry
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck components
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build registry
        run: node scripts/build-registry.mjs

      # public/r is generated. If it drifts from registry.json the copy in the
      # repo stops matching what is served, so fail loudly rather than let a
      # stale committed build sit there looking authoritative.
      - name: Check committed build is in sync
        run: |
          if ! git diff --quiet -- public/r; then
            echo "::error::public/r is out of date. Run 'node scripts/build-registry.mjs' and commit the result."
            git diff --stat -- public/r
            exit 1
          fi

      # The installer lands in /usr/local/bin when it can sudo and ~/.local/bin
      # when it can't, so put both on PATH rather than guessing which.
      - name: Install beacon
        run: |
          curl -fsSL https://chorus.host/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify beacon is on PATH
        run: beacon version

      - name: Deploy to chorus.host
        working-directory: public
        env:
          CHORUS_API_KEY: ${{ secrets.CHORUS_API_KEY }}
        run: |
          beacon deploy \
            --slug beautiful-ui \
            --api-key "$CHORUS_API_KEY" \
            --pretty

      - name: Verify the registry is live
        run: |
          set -euo pipefail
          for item in registry theme thinking-state task-rows; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://beautiful-ui.chorus.host/r/$item.json")
            echo "r/$item.json -> $code"
            [ "$code" = "200" ] || exit 1
          done
